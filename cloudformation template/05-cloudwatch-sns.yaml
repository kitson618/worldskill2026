AWSTemplateFormatVersion: '2010-09-09'
Description: WorldSkills practice - SNS alert topic and EC2 CPU alarm

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  AlertEmail:
    Type: String
    Description: Email address that must confirm the SNS subscription
  CpuThreshold:
    Type: Number
    Default: 80

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 average CPU above threshold for 10 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref CpuThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

Outputs:
  TopicArn:
    Value: !Ref AlertTopic
  AlarmName:
    Value: !Ref HighCpuAlarm
