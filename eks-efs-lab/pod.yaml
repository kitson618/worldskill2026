apiVersion: v1
kind: Pod
metadata:
    name: efs-app
spec:
    containers:
        - name: app
          image: centos
          command: ["/bin/sh"]
          args:
              [
                  "-c",
                  "while true; do echo $(date -u) >> /mnt/efs/output; sleep 5; done",
              ]
          volumeMounts:
              - name: persistent-storage
                mountPath: /mnt/efs
    volumes:
        - name: persistent-storage
          persistentVolumeClaim:
              claimName: efs-claim
