# Giftree gift-shop-api configuration
# Mount this file into the container at /app/config.ini (a ConfigMap is recommended).
# Inline comments are NOT supported — edit values only.

[app]
port = 8080

[aws]
region = us-east-1

[database]
# Aurora PostgreSQL writer endpoint
host = gift-aurora-cluster.cluster-XXXXXXXXXXXX.us-east-1.rds.amazonaws.com
port = 5432
dbname = giftdb
# Secrets Manager secret name — SecretString is JSON: {"username": "...", "password": "..."}
secret_name = gift/aurora/credentials

[firehose]
# Amazon Data Firehose stream that receives order events
stream_name = gift-order-stream
