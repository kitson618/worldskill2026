# MARK: Ec2 Pre-config
  Ec2KeyPair:
    Type: 'AWS::EC2::KeyPair'
    Properties:
      KeyName: !Sub ${EnvironmentName}-ec2-keypair

  EC2Role: 
    Type: "AWS::IAM::InstanceProfile"
    Properties: 
      Path: "/"
      Roles: 
        - !Ref Ec2RoleName


# MARK: Bastion
  BastionSg:
    Type: AWS::EC2::SecurityGroup
    DependsOn: VPC
    Properties:
      GroupDescription: SG to test ping
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 119.237.240.242/32

  Ec2Instance: 
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: "ami-0b72821e2f351e396"
      KeyName: !Ref Ec2KeyPair
      InstanceType: t3.micro
      IamInstanceProfile: !Ref EC2Role
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          sudo su
          cd /root
          yum update -y
          yum install -y docker
          service docker start
          usermod -a -G docker ec2-user
          curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          yum install libxcrypt-compat -y
      NetworkInterfaces: 
        - AssociatePublicIpAddress: "true"
          DeviceIndex: "0"
          GroupSet: 
            - !Ref BastionSg 
          SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: bastion

# # MARK: AutoScaling Group
  ApplicationSg:
    Type: AWS::EC2::SecurityGroup
    DependsOn: VPC
    Properties:
      GroupDescription: applciation
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCIDR
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
