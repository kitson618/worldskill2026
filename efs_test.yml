apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
  namespace: storage
spec:
  capacity:
    storage: 30Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-017948b4222ebc498

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-claim
  namespace: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "efs-sc"
  volumeName: efs-pv
  resources:
    requests:
      storage: "5Gi"

---
apiVersion: v1
kind: Pod
metadata:
  name: efs-centos-writer
  namespace: storage
spec:
  containers:
    - name: efs-centos-writer
      image: centos
      command: ["/bin/sh"]
      args: ["-c", "while true; do echo $(date -u) >> /data/centos.txt; sleep 5; done"]
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: efs-claim